<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vista en dispositivos · Olea</title>
<style>
  body { margin: 0; padding: 20px; background: #0b2e47; font: 14px system-ui; color: #fff; }
  h1 { font: 400 24px Georgia; margin: 0 0 14px; }
  .fila { display: flex; gap: 24px; align-items: flex-start; overflow-x: auto; }
  figure { margin: 0; }
  figcaption { margin-bottom: 8px; opacity: .8; }
  iframe { border: 0; border-radius: 28px; background: #fff; box-shadow: 0 0 0 10px #1b1f24; display: block; }
  .tel { width: 390px; height: 844px; }
  .tab { width: 820px; height: 1180px; }
</style>
</head>
<body>
<h1>Olea en móvil y tableta</h1>
<div class="fila">
  <figure><figcaption>Carta · iPhone 14 (390 × 844)</figcaption><iframe class="tel" id="m-carta" src="../index.html"></iframe></figure>
  <figure><figcaption>TPV · iPhone 14 (390 × 844)</figcaption><iframe class="tel" id="m-tpv" src="../tpv.html"></iframe></figure>
  <figure><figcaption>TPV · iPad Air (820 × 1180)</figcaption><iframe class="tab" id="t-tpv" src="../tpv.html"></iframe></figure>
</div>
</body>
</html>
